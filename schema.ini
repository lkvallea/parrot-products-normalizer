products-normalizer/
├─ app.py                          # Punto de entrada (CLI simple)
├─ etc/
│  └─ config.yaml                  # Reglas: stopwords, sinónimos, umbrales
├─ data/
│  ├─ products_sold.csv            # Entrada (tu CSV)
│  └─ products_sold_grouped.csv    # Salida (se genera)
└─ src/
   ├─ domain/
   │  ├─ models/
   │  │  ├─ product_row.py         # ProductRow(raw_name, count)
   │  │  ├─ canonicalized.py       # Canonicalized(tokens, key, ngrams3, phon_key)
   │  │  └─ cluster.py             # Cluster(master_key, variants, total_count, scores)
   │  └─ services/
   │     ├─ cleaner.py             # lower, tildes, símbolos, espacios
   │     ├─ normalizer.py          # stopwords, genéricos, singular, sinónimos, clave canónica
   │     ├─ blocking.py            # índice por prefijo/fonética/3-gramas
   │     ├─ similarity.py          # jaccard(tokens/3-gramas) + DL acotado
   │     └─ clusterer.py           # clustering incremental (maestros)
   ├─ infrastructure/
   │  └─ io/
   │     ├─ csv_reader.py          # stream -> ProductRow
   │     └─ csv_writer.py          # write name,count
   └─ application/
      └─ pipeline.py               # orquesta: leer -> procesar -> escribir
